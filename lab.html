<!DOCTYPE html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<style>
    #panzoom-element3:hover area {
      border: 3px solid #F00;
      outline: 100px solid #007bff; /* Adds a blue outline */
      outline-offset: 10px;      /* Creates space between the outline and the area */
    }
</style>
</head>
<body>
<div id="panzoom-element" style="position:relative;width:500px;">
<div id="panzoom-element3" style="position:relative;top:0px;left:0px;margin:0px;width:500px;border:2px solid #FF0000;">
  <img id="panzoom-element2" src="./example1.png" style="width:100%;opacity: 0.5;" usemap="#image-map"/>  
  <!-- Image Map Generated by http://www.image-map.net/ -->
  <map id="image-map" name="image-map" style="width:100%;background-color:#F00;opacity:1;">
  <area id="imap" onclick="alert('Boop!')" href="javascript:void(0);" coords="878,798,897,746,772,707,749,740,713,742,689,749,680,787,688,838,784,930,798,889,817,879,839,883,887,930,871,881,872,845" shape="poly" class="panzoom-exclude">
  <area onclick="console.log('ppp')" href="javascript:void(0);" coords="265,603,34" shape="circle">
  <area onclick="alert('Bop bop!')" href="javascript:void(0);" coords="575,300,620,378" shape="rect">
  </map>
  <!-- <div id="arg" style="position:absolute;top:100px;;left:100px;" onclick="console.log('Bah!');" class="panzoom-exclude">Hello!</div> -->
</div>
</div>
<script>
window.addEventListener('load', function() {
  resizeMap()
})

function resizeMap() {
  const image = document.getElementById("panzoom-element2");
  const map = document.querySelector("map[name='image-map']");
  
  if (!image || !map || !image.naturalWidth) return;
  
  const scale = image.clientWidth / image.naturalWidth;
  
  map.querySelectorAll("area").forEach(area => {
    if (!area.dataset.originalCoords) {
      area.dataset.originalCoords = area.getAttribute("coords");
    }
    
    const scaledCoords = area.dataset.originalCoords
      .split(",")
      .map(coord => Math.round(coord * scale))
      .join(",");
    
    area.setAttribute("coords", scaledCoords);
  });
}
</script>
</body>
