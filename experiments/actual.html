<script>
let SW = { ui: {} }
SW.ui.open_task = function(task_id) {  alert('Open Task: ' + task_id, '#ABBDDE' ) }
SW.ui.simple_task = function(task_id) {  alert('Simple Task: ' + task_id, '#BDDEAB' ) }
SW.ui.simple_alert = function(task_id) {  alert('Simple Task: ' + task_id, '#FFaaaa' ) }

    ['TSK_SCRAMBLED_0032',SW.ui.open_task],

let om2 = new OverMap({
  parent: 'group-static2',
  background: './example4.jpg',  
  launch_mode: 'icon',
  look_around: true,
  // look_around_max: 2,
  global_look_around_max: 2,
  panzoom_height: 600,
  svg_base: `
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 650 650" width="650" height="650"></svg>
  `,

    ['TSK_SCRAMBLED_0033',SW.ui.simple_task],
  ]

})

// Override the default alert function
window.alert = function(message,backgroundColor="#fff") {
    // Create a custom alert container
    const alertBox = document.createElement('div');
    alertBox.style.color = '#000000';
    alertBox.style.position = 'fixed';
    alertBox.style.top = '50%';
    alertBox.style.left = '50%';
    alertBox.style.transform = 'translate(-50%, -50%)';
    alertBox.style.backgroundColor = backgroundColor;
    alertBox.style.border = '2px solid #000';
    alertBox.style.padding = '20px';
    alertBox.style.borderRadius = '8px';
    alertBox.style.boxShadow = '0 10px 10px rgba(0,0,0,0.3)';
    alertBox.style.zIndex = '10000';
    alertBox.style.maxWidth = '300px';
    alertBox.style.textAlign = 'center';

    // Add message
    const messageEl = document.createElement('p');
    messageEl.textContent = message;
    messageEl.style.marginBottom = '15px';

    // Add OK button
    const okBtn = document.createElement('button');
    okBtn.textContent = 'OK';
    okBtn.style.padding = '8px 16px';
    // okBtn.style.backgroundColor = '#555555';
    // okBtn.style.color = '#fff';
    okBtn.style.border = 'none';
    okBtn.style.borderRadius = '4px';
    okBtn.style.cursor = 'pointer';
    okBtn.onclick = () => {
        document.body.removeChild(alertBox);
    };

    // Append elements
    alertBox.appendChild(messageEl);
    alertBox.appendChild(okBtn);
    document.body.appendChild(alertBox);
};

</script>
</body>
