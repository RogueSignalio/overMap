<!DOCTYPE html>
<head>
<script src="https://unpkg.com/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>
</head>
<body >
<div id="panzoom-element3" style="width:300px;height:500px;margin:20px;">
<div id="panzoom-element" style="width:500px;height:500px;border:2px solid #FFFF00;">
<img id="panzoom-element2" src="./example1.png" style="width:500px;height:500px;position:absolute;"/>  
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="500" height="500" style="position: absolute;">
  <rect width="50" height="50" x="200" y="200" stroke-width="2" stroke="#ffff00" fill="#00000001" id="s01" name="shape01" transform="matrix(1,0,0,1,0,0)" onclick="alert('Rect #1')"></rect>
  <ellipse rx="40" ry="45" cx="300" cy="300" stroke-width="2" stroke="#ffff00" fill="#00000001" id="s02" name="shape02" transform="matrix(1,0,0,1,0,0)" onclick="alert('Ellipse #1')"></ellipse>
  <polygon points="39,49 131,102 44,138" stroke-width="2" stroke="#ffff00" fill="#00000001" id="s03" name="shape03" transform="matrix(1,0,0,1,0,0)" onclick="alert('Polygon #1')"></polygon>
  <polygon points="59,49 151,102 64,138" stroke-width="2" stroke="#ffff00" fill="#00000001" id="s04" name="shape04" transform="matrix(6.123233995736766e-17,1,-1,6.123233995736766e-17,198.5,-11.5)" onclick="alert('Polygon #2')"></polygon>
  <image width="128" height="87" xlink:href="./fishkey_embed.png" x="200" y="10" id="l1" name="lala1" style="filter: saturate(5.75);" transform="matrix(1,0,0,1,0,0)" onclick="alert('Another Key!.')"></image>
  <image onclick="alert('Key!  I love keys.')" width="128" height="87" xlink:href="https://scramble.roguesignal.io/by_game_asset/GM_CLOCK_TOWER_01/user_task_embed-fish_key?time=123123" x="200" y="110" id="l2" name="lala2" style="filter: saturate(0.75);visibility: display;" transform="matrix(0.9396926207859084,0.3420201433256687,-0.3420201433256687,0.9396926207859084,68.42124011301033,-81.03613512861347)"></image></svg>
</div>
</div>
<script>
let panzoom = null

window.addEventListener('load', function() {
   makeMe();
});

function makeMe() {
  let elem = document.getElementById('panzoom-element')
  panzoom = Panzoom(elem,{
    width: '500px',
    height: '500px',    
    maxScale: 10,
    minScale: 1,
    startScale: 1,
    // panOnlyWhenZoomed: true,
    contain: 'outside',
    excludeClass: 'panzoom-exclude',
//    canvas: true,
    roundPixels: true,
    startX: 0,
    startY: 0,
  })

  elem.parentElement.addEventListener('wheel', panzoom.zoomWithWheel)
}

// Override the default alert function
window.alert = function(message) {
    // Create a custom alert container
    const alertBox = document.createElement('div');
    alertBox.style.position = 'fixed';
    alertBox.style.top = '50%';
    alertBox.style.left = '50%';
    alertBox.style.transform = 'translate(-50%, -50%)';
    alertBox.style.backgroundColor = '#fff';
    alertBox.style.border = '2px solid #000';
    alertBox.style.padding = '20px';
    alertBox.style.borderRadius = '8px';
    alertBox.style.boxShadow = '0 4px 10px rgba(0,0,0,0.3)';
    alertBox.style.zIndex = '10000';
    alertBox.style.maxWidth = '300px';
    alertBox.style.textAlign = 'center';

    // Add message
    const messageEl = document.createElement('p');
    messageEl.textContent = message;
    messageEl.style.marginBottom = '15px';

    // Add OK button
    const okBtn = document.createElement('button');
    okBtn.textContent = 'OK';
    okBtn.style.padding = '8px 16px';
    okBtn.style.backgroundColor = '#007BFF';
    okBtn.style.color = '#fff';
    okBtn.style.border = 'none';
    okBtn.style.borderRadius = '4px';
    okBtn.style.cursor = 'pointer';
    okBtn.onclick = () => {
        document.body.removeChild(alertBox);
    };

    // Append elements
    alertBox.appendChild(messageEl);
    alertBox.appendChild(okBtn);
    document.body.appendChild(alertBox);
};
</script>
</body>
