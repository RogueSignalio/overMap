function resizeMap() {
  const image = document.getElementById("panzoom-element2");
  const map = document.querySelector("map[name='image-map']");
  
  if (!image || !map || !image.naturalWidth) return;
  
  const scale = image.clientWidth / image.naturalWidth;
  
  map.querySelectorAll("area").forEach(area => {
    if (!area.dataset.originalCoords) {
      area.dataset.originalCoords = area.getAttribute("coords");
    }
    
    const scaledCoords = area.dataset.originalCoords
      .split(",")
      .map(coord => Math.round(coord * scale))
      .join(",");
    
    area.setAttribute("coords", scaledCoords);
  });
}

function waitForAllImages() {
  // 1. Handle standard HTML <img> tags

  const htmlPromises = htmlImages.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise((resolve) => {
      img.addEventListener('load', resolve, { once: true });
      img.addEventListener('error', resolve, { once: true });
    });
  });

  // 2. Handle SVG <image> tags
  const svgImages = Array.from(document.querySelectorAll('svg image'));
console.log('svgImages',svgImages)

function convertImageMapToSVG(mapId) {
  const map = document.getElementById(mapId);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 1000 600");
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", "auto");

  Array.from(map.querySelectorAll("area")).forEach(area => {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", getSVGPath(area));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "red");
    path.setAttribute("stroke-width", "1");
    path.setAttribute("href", area.getAttribute("href"));
    svg.appendChild(path);
  });

  return svg;
}

function getSVGPath(area) {
  const coords = area.coords.split(",").map(Number);
  const shape = area.shape;

  switch (shape) {
    case "rect":
      return `M ${coords[0]},${coords[1]} L ${coords[2]},${coords[1]} L ${coords[2]},${coords[3]} L ${coords[0]},${coords[3]} z`;
    case "circle":
      return `M ${coords[0]},${coords[1]} m -${coords[2]},0 a ${coords[2]},${coords[2]} 0 1,0 ${coords[2]*2},0 a ${coords[2]},${coords[2]} 0 1,0 -${coords[2]*2},0`;
    case "poly":
      const path = coords.reduce((acc, val, i) => {
        return acc + (i % 2 === 0 ? `M ${val},${coords[i+1]} ` : `L ${val},${coords[i+1]} `);
      }, "");
      return path + "z";
    default:
      return "";
  }
}

    alertBox.style.left = '50%';

    alertBox.style.backgroundColor = '#fff';
    alertBox.style.border = '2px solid #000';
    alertBox.style.padding = '20px';
    alertBox.style.borderRadius = '8px';
    alertBox.style.boxShadow = '0 4px 10px rgba(0,0,0,0.3)';
    alertBox.style.zIndex = '10000';
    alertBox.style.maxWidth = '300px';
    alertBox.style.textAlign = 'center';

    // Add message
    const messageEl = document.createElement('p');
    messageEl.textContent = message;
    messageEl.style.marginBottom = '15px';

    // Add OK button
    const okBtn = document.createElement('button');
    okBtn.textContent = 'OK';
    okBtn.style.padding = '8px 16px';
    okBtn.style.backgroundColor = '#007BFF';
    okBtn.style.color = '#fff';
    okBtn.style.border = 'none';
    okBtn.style.borderRadius = '4px';
    okBtn.style.cursor = 'pointer';
    okBtn.onclick = () => {
        document.body.removeChild(alertBox);
    };

    // Append elements
    alertBox.appendChild(messageEl);
    alertBox.appendChild(okBtn);
    document.body.appendChild(alertBox);
};
