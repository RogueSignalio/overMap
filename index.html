<!DOCTYPE html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<script src="https://unpkg.com/@panzoom/panzoom@4.6.1/dist/panzoom.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/RogueSignalio/overBase@v0.1/css/over_demo.min.css" id="page_style">
  <style>
    html { font-size: 14px; }
    body { margin: 10; flex-wrap: wrap; display: flex; justify-content: center; align-items: center; }
    canvas { border: 2px solid #444; margin:8px; }
    button { background: #222222; color: #FFCC00; font-size:15px; min-width: auto;
              border-radius: 10px; padding: 3px;margin:3px;border:3px solid #FFCC00; }
    input { background: #222222; color: #FFCC00; font-size: 20px; }
    div { font-size:14px; }
    .thehand {
      cursor: pointer;
    }
  </style>
</head>
<body >
<div id="panzoom-element3" style="visibility:hidden;margin:20px;">
  <div id="panzoom-element" style="width:500px;">
    <img id="panzoom-element2" src="./example1.png" style="width:100%;" usemap="#image-map"/>  
    <!-- Image Map Generated by http://www.image-map.net/ -->
    <img src="./key_small.png" style="transform: rotate(-70deg);filter: brightness(40%) contrast(110%) sepia(50%) drop-shadow(1px -1px 1px #000);border:0px solid #F00; width:5px;position:absolute;bottom:15px;left:90px;" class="panzoom-exclude" onMouseOver="this.style.cursor='pointer'" onclick="alert('Key!  I love keys.')"/>
    <map id="image-map" name="image-map" class="panzoom-exclude" >
    <area tabindex=2 id="amap1" onclick="alert('I was an important citizen, you know...')" href="javascript:void(0);" coords="878,798,897,746,772,707,749,740,713,742,689,749,680,787,688,838,784,930,798,889,817,879,839,883,887,930,871,881,872,845" shape="poly" onmouseenter="console.log('!!!');">
    <area id="amap2" onclick="alert('Psst. Smell me... hehe.')" href="javascript:void(0);" coords="265,603,34" shape="circle">
    <area id="amap3" onclick="alert('A curious little insect flies around in this terrarium.')" href="javascript:void(0);" coords="575,300,620,378" shape="rect">
    </map>
  </div>
</div>
<script>
let panzoom = null
window.addEventListener('load', function() {
  let elem = document.getElementById('panzoom-element')
  panzoom = Panzoom(elem,{
    maxScale: 10,
    minScale: 1,
    startScale: 1,
    // panOnlyWhenZoomed: true,
    contain: 'outside',
    excludeClass: 'panzoom-exclude',
    // roundPixels: true,
    // startX: 0,
    // startY: 0,
  })
  elem.parentElement.addEventListener('wheel', panzoom.zoomWithWheel)
  resizeMap()
  panzoom.zoom(2)
  setTimeout(() => panzoom.pan(0, 0),200)
  setTimeout(function() {
    document.getElementById('panzoom-element').style.visibility = 'visible'
  },300)
});

function resizeMap() {
  const image = document.getElementById("panzoom-element2");
  const map = document.querySelector("map[name='image-map']");
  
  if (!image || !map || !image.naturalWidth) return;
  
  const scale = image.clientWidth / image.naturalWidth;
  
  map.querySelectorAll("area").forEach(area => {
    if (!area.dataset.originalCoords) {
      area.dataset.originalCoords = area.getAttribute("coords");
    }
    
    const scaledCoords = area.dataset.originalCoords
      .split(",")
      .map(coord => Math.round(coord * scale))
      .join(",");
    
    area.setAttribute("coords", scaledCoords);
  });
}

function convertImageMapToSVG(mapId) {
  const map = document.getElementById(mapId);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 1000 600");
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", "auto");

  Array.from(map.querySelectorAll("area")).forEach(area => {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", getSVGPath(area));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "red");
    path.setAttribute("stroke-width", "1");
    path.setAttribute("href", area.getAttribute("href"));
    svg.appendChild(path);
  });

  return svg;
}

function getSVGPath(area) {
  const coords = area.coords.split(",").map(Number);
  const shape = area.shape;

  switch (shape) {
    case "rect":
      return `M ${coords[0]},${coords[1]} L ${coords[2]},${coords[1]} L ${coords[2]},${coords[3]} L ${coords[0]},${coords[3]} z`;
    case "circle":
      return `M ${coords[0]},${coords[1]} m -${coords[2]},0 a ${coords[2]},${coords[2]} 0 1,0 ${coords[2]*2},0 a ${coords[2]},${coords[2]} 0 1,0 -${coords[2]*2},0`;
    case "poly":
      const path = coords.reduce((acc, val, i) => {
        return acc + (i % 2 === 0 ? `M ${val},${coords[i+1]} ` : `L ${val},${coords[i+1]} `);
      }, "");
      return path + "z";
    default:
      return "";
  }
}

// Override the default alert function
window.alert = function(message) {
    // Create a custom alert container
    const alertBox = document.createElement('div');
    alertBox.style.position = 'fixed';
    alertBox.style.top = '50%';
    alertBox.style.left = '50%';
    alertBox.style.transform = 'translate(-50%, -50%)';
    alertBox.style.backgroundColor = '#fff';
    alertBox.style.border = '2px solid #000';
    alertBox.style.padding = '20px';
    alertBox.style.borderRadius = '8px';
    alertBox.style.boxShadow = '0 4px 10px rgba(0,0,0,0.3)';
    alertBox.style.zIndex = '10000';
    alertBox.style.maxWidth = '300px';
    alertBox.style.textAlign = 'center';

    // Add message
    const messageEl = document.createElement('p');
    messageEl.textContent = message;
    messageEl.style.marginBottom = '15px';

    // Add OK button
    const okBtn = document.createElement('button');
    okBtn.textContent = 'OK';
    okBtn.style.padding = '8px 16px';
    okBtn.style.backgroundColor = '#007BFF';
    okBtn.style.color = '#fff';
    okBtn.style.border = 'none';
    okBtn.style.borderRadius = '4px';
    okBtn.style.cursor = 'pointer';
    okBtn.onclick = () => {
        document.body.removeChild(alertBox);
    };

    // Append elements
    alertBox.appendChild(messageEl);
    alertBox.appendChild(okBtn);
    document.body.appendChild(alertBox);
};
</script>
</body>
